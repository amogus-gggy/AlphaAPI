[package]
name = "alphaapi"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A fast, Django-shaped async Python web framework powered by Rust"
license = "MIT"
readme = "README.md"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = "0.29"
pythonize = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
http = "1"
matchit = "0.8"
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
itoa = "1"
ryu = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
